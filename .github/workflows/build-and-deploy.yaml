# Publica en Docker Hub y despliega en Bigoci tras cada push a main.
name: Build and Deploy Fund NAV Fetcher

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serializa los despliegues sin interrumpir una actualización en curso.
concurrency:
  group: fund-nav-fetcher-production
  cancel-in-progress: false

jobs:
  build-docker-image:
    # Etiqueta del runner utilizada por CR2F para la máquina Bigoci.
    runs-on: bigoci
    timeout-minutes: 30
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Construir y publicar la imagen ARM64
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./ops/docker/Dockerfile
          push: true
          platforms: linux/arm64
          tags: serhuela/fund-nav-fetcher:latest

  deploy-to-bigoci:
    needs: build-docker-image
    runs-on: bigoci
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Copiar Docker Compose a Bigoci
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: ops/docker/docker-compose.yml
          target: apps/fund-nav-fetcher/

      - name: Desplegar la imagen publicada
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: DOCKER_HUB_USERNAME,DOCKER_HUB_TOKEN
          command_timeout: 8m
          script: |
            set -eu
            cd apps/fund-nav-fetcher/ops/docker
            # Autenticación temporal, también válida para repositorios privados.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
            # Descarga antes de sustituir el contenedor que ya está funcionando.
            docker compose pull
            docker compose up -d --force-recreate --wait --wait-timeout 60
            docker compose ps
