<title id="title">Modelo entidad-relación del bot de valores liquidativos</title>
<desc id="desc">Cuatro tablas. Fondos y proveedores se relacionan mediante fund_sources. Cada valor liquidativo referencia una asociación del mismo fondo mediante una clave foránea compuesta.</desc>
