[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-nav-fetcher"
version = "0.1.0"
description = "Obtención y almacenamiento de valores liquidativos de fondos de inversión."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.2,<7", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist[psutil]>=3",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["code"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
markers = ["integration: pruebas que conectan con PostgreSQL de desarrollo"]
pythonpath = ["code"]
addopts = [
    "--import-mode=importlib",
    "-m", "not integration",
    "-n", "logical",
    "--dist=worksteal",
    "--cov=code",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--durations=10",
    "-ra",
]

[tool.setuptools.package-data]
utils = ["config.yaml"]
